<h1>Characters</h1>

@for (character of characterList; track character.name; let e = $even, o = $odd) {
  <app-character-list-item [class.even]="e" [class.odd]="o" [routerLink]="['/characters', character.id]"></app-character-list-item>
}

<!-- Edit Button -->
<button type="button" (click)="navigateToForm()">Edit</button>

<!-- Delete Button -->
<button type="button">Delete</button>
