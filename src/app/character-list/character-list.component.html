<h1>Characters</h1>

@for (character of characterList; track character.name; let e = $even, o = $odd) {
  <app-character-list-item [character]="character" [class.even]="e" [class.odd]="o" [routerLink]="['/characters', character.id]"></app-character-list-item>

  <div class="buttons">
    <!-- Edit Button -->
    <button type="button" [routerLink]="['/modify-character', character.id]" [appHoverHighlight]="'indigo'">Edit</button>

    <!-- Delete Button -->
    <button type="button" (click)="onDelete(character.id)" [appHoverHighlight]="'maroon'">Delete</button>
  </div>
}

<div *ngIf="error" class="error">{{error}}</div>
