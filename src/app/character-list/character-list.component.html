<h1>Characters</h1>


<div class="mat-container">
  <table mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by ID">ID</th>
      <td mat-cell *matCellDef="let character">{{character.id}}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by name">Name</th>
      <td mat-cell *matCellDef="let character">{{character.name}}</td>
    </ng-container>

    <ng-container matColumnDef="gender">
      <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by gender">Gender</th>
      <td mat-cell *matCellDef="let character">{{character.gender}}</td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by type">Type</th>
      <td mat-cell *matCellDef="let character">{{character.type}}</td>
    </ng-container>

    <ng-container matColumnDef="riderStatus">
      <th mat-header-cell *matHeaderCellDef>Rider Status</th>
      <td mat-cell *matCellDef="let character">{{character.isARider ? 'Rider' : 'Non-Rider'}}</td>
    </ng-container>

    <ng-container matColumnDef="image">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let character">
        <img src="/images/{{character.riderName}}.png" alt="Portrait of {{character?.riderName}}"/>
      </td>
    </ng-container>

    <ng-container matColumnDef="buttons">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let character">
        <button matButton
                matTooltip="Modify character information"
                (click)="sendToEdit(character.id)"><mat-icon>edit</mat-icon>Edit</button>
        <button matButton
                matTooltip="Delete character from list"
                (click)="onDelete(character.id)"><mat-icon>delete</mat-icon>Delete</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let character; columns: displayedColumns"
        [routerLink]="['/characters', character.id]"
        [appHoverHighlight]="'lavender'">
    </tr>
  </table>

  <mat-paginator [length]="4"
                 [pageSize]="7"
                 [pageSizeOptions]="[5, 10, 25, 50]">
  </mat-paginator>
</div>

<div *ngIf="error" class="error">{{error}}</div>
